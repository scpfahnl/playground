apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.keda.repoURL }}
    chart: {{ .Values.keda.chart }}
    targetRevision: {{ .Values.keda.version }}
    helm:
      releaseName: keda
      valuesObject:
        nodeSelector:
          {{- toYaml .Values.control.nodeSelector | nindent 10 }}
        tolerations:
          {{- toYaml .Values.control.tolerations | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
