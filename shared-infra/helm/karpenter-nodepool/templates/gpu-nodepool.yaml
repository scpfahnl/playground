apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        nvidia.com/gpu.present: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.capacityTypes }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ toJson .Values.gpu.instanceFamilies }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ toJson .Values.gpu.instanceSizes }}
      expireAfter: 720h
  limits:
    nvidia.com/gpu: {{ .Values.gpu.limit }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
