name: Threat Feed Analyzer API Image Build
on:
  push:
    branches:
    - main
    paths:
    - 'applications/threat-feed-analyzer/api/**'
    - 'applications/threat-feed-analyzer/shared/**'
    - '.github/workflows/tfa-api-image-build.yml'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6
    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USER}}
        password: ${{secrets.DOCKERHUB_PAT}}
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./applications/threat-feed-analyzer
        file: ./applications/threat-feed-analyzer/api/Dockerfile
        push: true
        tags: |
          steffenp123/tfa-api:1.${{ github.run_number }}
          steffenp123/tfa-api:latest
