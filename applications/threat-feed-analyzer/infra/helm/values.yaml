api:
  name: api
  image:
    repository: steffenp123/tfa-api
    tag: latest
  port: 8000
  serviceAccountName: api
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

worker:
  image:
    repository: steffenp123/tfa-worker
    tag: latest
  serviceAccountName: worker
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 3
    queueLength: 1

vllm:
  image:
    repository: vllm/vllm-openai
    tag: v0.34.0
  chat:
    name: vllm-chat
    model: Qwen/Qwen2.5-7B-Instruct-AWQ
    maxModelLen: 8192
    gpuMemoryUtilization: 0.6
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
      limits:
        memory: 10Gi
  embedding:
    name: vllm-embedding
    model: Qwen/Qwen3-Embedding-0.6B
    maxModelLen: 2048
    gpuMemoryUtilization: 0.25
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        memory: 6Gi

summarize:
  image:
    repository: curlimages/curl
    tag: "8.23.0"
  schedule: "0 */4 * * *"

ingress:
  host: ""

config: {}
