apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: threat-feed-analyzer-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: threat-feed-analyzer-secrets
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql+psycopg://{{`{{ .DB_USERNAME }}`}}:{{`{{ .DB_PASSWORD }}`}}@{{`{{ .DB_ENDPOINT }}`}}:5432/{{`{{ .DB_NAME }}`}}"
  dataFrom:
    - extract:
        key: {{ .Values.env }}/tfa/config
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.env }}/tfa/db-master
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.env }}/tfa/db-master
        property: password
