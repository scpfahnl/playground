apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.vllm.chat.name }}
  labels:
    app: {{ .Values.vllm.chat.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.vllm.chat.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.vllm.chat.name }}
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          command: ["vllm", "serve"]
          args:
            - {{ .Values.vllm.chat.model | quote }}
            - "--port"
            - "8000"
            - "--max-model-len"
            - {{ .Values.vllm.chat.maxModelLen | quote }}
            - "--gpu-memory-utilization"
            - {{ .Values.vllm.chat.gpuMemoryUtilization | quote }}
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: {{ .Values.vllm.chat.resources.requests.cpu }}
              memory: {{ .Values.vllm.chat.resources.requests.memory }}
            limits:
              memory: {{ .Values.vllm.chat.resources.limits.memory }}
              nvidia.com/gpu: 1
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: cache
          emptyDir: {}
