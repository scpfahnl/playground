name: threat-feed-analyzer
volumes:
  postgres-main:
  opensearch-main:

services:
  postgres:
    image: postgres:17
    ports:
    - 5432:5432
    volumes:
    - postgres-main:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
    - 9324:9324
    volumes:
    - ./elasticmq.conf:/opt/elasticmq.conf
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9324"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:latest
    ports:
    - 9200:9200
    volumes:
    - opensearch-main:/usr/share/opensearch/data
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-migration-job:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: alembic -c shared/alembic.ini upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  opensearch-migration-job:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python shared/indexes.py
    env_file: .env
    depends_on:
      opensearch:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
    - 8000:8000
    env_file: .env
    depends_on:
      db-migration-job:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    stop_grace_period: 30s
    env_file: .env
    depends_on:
      db-migration-job:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
      opensearch-migration-job:
        condition: service_completed_successfully
