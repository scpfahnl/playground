<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Feed Analyzer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; color: #1f2328; line-height: 1.5; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  h2 { font-size: 18px; margin-top: 40px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  button { padding: 8px 16px; cursor: pointer; border: 1px solid #1f2328; background: #1f2328; color: #fff; border-radius: 6px; }
  button:disabled { opacity: 0.5; cursor: default; }
  input { padding: 8px; width: 60%; border: 1px solid #bbb; border-radius: 6px; }
  .story { border: 1px solid #ddd; border-radius: 8px; padding: 14px 18px; margin: 14px 0; }
  .story h3 { margin: 0 0 6px; font-size: 16px; }
  .story p { margin: 6px 0; }
  .meta { color: #666; font-size: 13px; }
  .status { color: #666; margin-left: 12px; }
  ul { padding-left: 20px; margin: 8px 0 0; font-size: 14px; }
  a { color: #0969da; }
</style>
</head>
<body>
<h1>Threat Feed Analyzer</h1>
<div class="meta">Top security events from the last 24 hours</div>

<h2>Top stories</h2>
<button id="summarize">Run summary</button><span id="status" class="status"></span>
<div id="top-stories"></div>

<h2>Search</h2>
<form id="search-form">
  <input id="query" placeholder="Search stories, e.g. ransomware attack">
  <button>Search</button>
</form>
<div id="search-results"></div>

<script>
function addElement(parent, tag, text, className) {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  if (className) element.className = className;
  parent.appendChild(element);
  return element;
}

function addLink(parent, text, href) {
  const link = addElement(parent, "a", text);
  link.href = href;
  link.target = "_blank";
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function runSummary() {
  const button = document.getElementById("summarize");
  const status = document.getElementById("status");
  const container = document.getElementById("top-stories");
  button.disabled = true;
  container.innerHTML = "";
  status.textContent = "Starting...";

  const resp = await fetch("/summarize", { method: "POST" });
  if (!resp.ok) {
    status.textContent = "Failed to start job";
    button.disabled = false;
    return;
  }
  const data = await resp.json();
  const jobId = data.job_id;

  while (true) {
    await sleep(3000);
    const job = await (await fetch("/jobs/" + jobId)).json();
    status.textContent = job.status + "...";
    if (job.status === "failed") {
      status.textContent = "Failed: " + job.error;
      break;
    }
    if (job.status === "completed") {
      status.textContent = "";
      showTopStories(job.result.top_stories);
      break;
    }
  }
  button.disabled = false;
}

function showTopStories(topStories) {
  const container = document.getElementById("top-stories");
  for (const topStory of topStories) {
    const card = addElement(container, "div", null, "story");
    addElement(card, "h3", topStory.title);
    addElement(card, "div", new Set(topStory.sources).size + " sites", "meta");
    addElement(card, "p", topStory.summary);
    const list = addElement(card, "ul");
    for (let i = 0; i < topStory.links.length; i++) {
      const item = addElement(list, "li");
      addLink(item, topStory.sources[i] + ": " + topStory.titles[i], topStory.links[i]);
    }
  }
}

async function search(event) {
  event.preventDefault();
  const container = document.getElementById("search-results");
  container.innerHTML = "";
  const query = document.getElementById("query").value;
  if (!query) return;

  const resp = await fetch("/search?q=" + encodeURIComponent(query));
  if (!resp.ok) {
    addElement(container, "p", "Search failed", "meta");
    return;
  }
  const results = await resp.json();
  for (const result of results) {
    const card = addElement(container, "div", null, "story");
    addLink(addElement(card, "h3"), result.title, result.link);
    addElement(card, "div", result.source + " · " + new Date(result.published).toLocaleString() + " · score " + result.score.toFixed(2), "meta");
    addElement(card, "p", result.summary);
  }
}

async function loadLatest() {
  const resp = await fetch("/jobs/latest");
  if (!resp.ok) return;
  const job = await resp.json();
  document.getElementById("status").textContent = "Last run: " + new Date(job.completed_at).toLocaleString();
  showTopStories(job.result.top_stories);
}

document.getElementById("summarize").addEventListener("click", runSummary);
loadLatest();
document.getElementById("search-form").addEventListener("submit", search);
</script>
</body>
</html>
