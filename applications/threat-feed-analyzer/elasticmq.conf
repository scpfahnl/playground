include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  summarize {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "summarize-dlq"
      maxReceiveCount = 3
    }
  }
  summarize-dlq { }
}
