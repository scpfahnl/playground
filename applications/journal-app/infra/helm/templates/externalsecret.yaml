apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: journal-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: journal-app-secrets
  dataFrom:
    - extract:
        key: {{ .Values.env }}/journal/config
  data:
    - secretKey: DB_MASTER_SECRET
      remoteRef:
        key: {{ .Values.env }}/journal/db-master
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.env }}/journal/db-master
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.env }}/journal/db-master
        property: password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ .Values.env }}/journal/api-jwt-signing-key
