apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: journal-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.journalApp.repoURL }}
    targetRevision: {{ .Values.journalApp.targetRevision }}
    path: {{ .Values.journalApp.path }}
    helm:
      valuesObject:
        api:
          image:
            tag: "1.29"
        env: {{ .Values.cluster.env | quote }}
        ingress:
          host: {{ .Values.cluster.domain | quote }}
        config:
          AWS_REGION: {{ .Values.cluster.region | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: journal-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1
