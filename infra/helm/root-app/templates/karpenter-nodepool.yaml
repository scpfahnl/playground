apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.karpenterNodePool.repoURL }}
    targetRevision: {{ .Values.karpenterNodePool.targetRevision }}
    path: {{ .Values.karpenterNodePool.path }}
    helm:
      valuesObject:
        clusterName: {{ .Values.cluster.name | quote }}
        nodeRole: {{ .Values.cluster.nodeRole | quote }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
