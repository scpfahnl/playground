apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.kubePrometheusStack.repoURL }}
    chart: {{ .Values.kubePrometheusStack.chart }}
    targetRevision: {{ .Values.kubePrometheusStack.version }}
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        alertmanager:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheusOperator:
          admissionWebhooks:
            certManager:
              enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          nodeSelector:
            {{- toYaml .Values.control.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.control.tolerations | nindent 12 }}
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          nodeSelector:
            {{- toYaml .Values.control.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.control.tolerations | nindent 12 }}
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: 18GB
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            nodeSelector:
              {{- toYaml .Values.control.nodeSelector | nindent 14 }}
            tolerations:
              {{- toYaml .Values.control.tolerations | nindent 14 }}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        grafana:
          admin:
            existingSecret: grafana-admin
          grafana.ini:
            server:
              root_url: {{ printf "https://grafana.%s" .Values.cluster.domain | quote }}
            plugins:
              preinstall_disabled: true
              disable_plugins: loki,zipkin,mysql,mssql,tempo,stackdriver,opentsdb,elasticsearch,jaeger,influxdb,grafana-pyroscope-datasource,grafana-postgresql-datasource
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
              alb.ingress.kubernetes.io/ssl-redirect: "443"
              alb.ingress.kubernetes.io/healthcheck-path: /api/health
            hosts:
              - {{ printf "grafana.%s" .Values.cluster.domain | quote }}
            tls:
              - hosts:
                  - {{ printf "grafana.%s" .Values.cluster.domain | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          nodeSelector:
            {{- toYaml .Values.control.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.control.tolerations | nindent 12 }}
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: aws-secrets-manager
            spec:
              provider:
                aws:
                  service: SecretsManager
                  region: {{ .Values.cluster.region | quote }}
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: aws-secrets-manager
                kind: SecretStore
              target:
                name: grafana-admin
              dataFrom:
                - extract:
                    key: {{ .Values.cluster.grafanaSecretArn | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
