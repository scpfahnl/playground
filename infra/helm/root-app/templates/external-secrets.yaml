apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.externalSecrets.repoURL }}
    chart: {{ .Values.externalSecrets.chart }}
    targetRevision: {{ .Values.externalSecrets.version }}
    helm:
      releaseName: external-secrets
      valuesObject:
        serviceAccount:
          name: external-secrets
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
        nodeSelector:
          {{- toYaml .Values.control.nodeSelector | nindent 10 }}
        tolerations:
          {{- toYaml .Values.control.tolerations | nindent 10 }}
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          nodeSelector:
            {{- toYaml .Values.control.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.control.tolerations | nindent 12 }}
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          nodeSelector:
            {{- toYaml .Values.control.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.control.tolerations | nindent 12 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
